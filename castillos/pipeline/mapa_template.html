  const b = document.createElement("button"); b.type = "button"; b.setAttribute("aria-pressed", "true");
  b.innerHTML = `<i class="s ${x.cls}"></i><span data-en="${x.en}">${x.name}</span> <span class="n">${n}</span>`;
  b.onclick = () => { activeE.has(x.k) ? activeE.delete(x.k) : activeE.add(x.k); b.setAttribute("aria-pressed", activeE.has(x.k)); applyFilter(); };
  document.getElementById("estados").appendChild(b);
});
document.getElementById("nund").textContent = CASTLES.features.filter(f => f.properties.a < 0).length;

// Histogram by 50-year bins
const MIN = 700, MAX = 1900, BIN = 50, hist = document.getElementById("hist");
const bins = Array.from({length:(MAX - MIN) / BIN}, (_, i) => CASTLES.features.filter(f => f.properties.a >= MIN + i * BIN && f.properties.a < MIN + (i + 1) * BIN).length);
const hmax = Math.max(...bins);
bins.forEach((v, i) => { const el = document.createElement("i"); el.style.height = (v / hmax * 100) + "%"; el.title = `${MIN + i * BIN}–${MIN + (i + 1) * BIN}: ${v}`; hist.appendChild(el); });

maplibregl.addProtocol("dem", async (params) => {
  const path = params.url.replace("dem://", "");
  const r = await fetch("dem/" + path + ".png");
  if (!r.ok) throw new Error("tile " + path);
  return {data: await r.arrayBuffer()};
});
const map = new maplibregl.Map({
  container: "map", attributionControl: false,
  style: {version: 8, sources: {}, layers: [{id: "bg", type: "background", paint: {"background-color": tok("--bg")}}]},
  bounds: [[-2.55, 41.88], [-0.7, 43.33]], fitBoundsOptions: {padding: {top: 60, bottom: 130, left: 40, right: 40}},
  maxBounds: [[-4.5, 40.8], [1.2, 44.4]], pitch: 55, maxPitch: 75, minZoom: 6.5
});
map.addControl(new maplibregl.NavigationControl({visualizePitch: true}), "bottom-right");
map.addControl(new maplibregl.AttributionControl({compact: true, customAttribution: L("Datos", "Data") + ": Wikidata, Wikipedia, © OpenStreetMap (ODbL)"}));

function colorExpr(){ return ["match", ["get", "p"], 0, tok("--p0"), 1, tok("--p1"), 2, tok("--p2"), 3, tok("--p3"), 4, tok("--p4"), tok("--pn")]; }
function paintTheme(){
  if (!map.getLayer("prov")) return;
  map.setPaintProperty("bg", "background-color", tok("--bg"));
  map.setPaintProperty("prov", "fill-color", ["case", ["get", "nav"], tok("--nav"), tok("--land")]);
  map.setPaintProperty("prov-line", "line-color", tok("--edge"));
  map.setPaintProperty("hill", "hillshade-shadow-color", tok("--shade"));
  map.setPaintProperty("hill", "hillshade-highlight-color", tok("--light"));
  map.setPaintProperty("hill", "hillshade-accent-color", tok("--shade"));
  map.setPaintProperty("nav-line", "line-color", tok("--fg"));
  map.setPaintProperty("fuera", "fill-color", tok("--bg"));
  map.setPaintProperty("rios", "line-color", tok("--river"));
  map.setPaintProperty("vias", "line-color", tok("--road"));
  map.setPaintProperty("vias-casing", "line-color", tok("--nav"));
  paintCastles();
  map.setPaintProperty("sel", "circle-stroke-color", tok("--fg"));
}
map.on("load", () => {
  map.addSource("prov", {type: "geojson", data: PROV});
  map.addLayer({id: "prov", type: "fill", source: "prov", paint: {"fill-color": "#ccc"}});
  map.addSource("dem", {type: "raster-dem", tiles: ["dem://{z}/{x}/{y}"], encoding: "terrarium", tileSize: 256, minzoom: 7, maxzoom: 10, bounds: [-3.2, 41.5, -0.1, 43.55]});
  map.addSource("dem-h", {type: "raster-dem", tiles: ["dem://{z}/{x}/{y}"], encoding: "terrarium", tileSize: 256, minzoom: 7, maxzoom: 10, bounds: [-3.2, 41.5, -0.1, 43.55]});
  map.addLayer({id: "hill", type: "hillshade", source: "dem-h", paint: {"hillshade-exaggeration": 0.55, "hillshade-shadow-color": "#000", "hillshade-highlight-color": "#fff", "hillshade-accent-color": "#000"}});
  map.setTerrain({source: "dem", exaggeration: 2.2});
  map.addControl(new maplibregl.TerrainControl({source: "dem", exaggeration: 2.2}), "bottom-right");
  map.addSource("rios", {type: "geojson", data: CAPAS.rivers});
  map.addLayer({id: "rios", type: "line", source: "rios", layout: {"line-cap": "round", "line-join": "round"},
    paint: {"line-color": "#7aa", "line-width": ["interpolate", ["linear"], ["zoom"], 7, ["case", ["get", "major"], 1.6, 0.8], 11, ["case", ["get", "major"], 3.5, 2]]}});
  map.addSource("vias", {type: "geojson", data: CAPAS.roads});
  map.addLayer({id: "vias-casing", type: "line", source: "vias", layout: {"line-cap": "round", "line-join": "round"},
    paint: {"line-color": "#fff", "line-width": ["interpolate", ["linear"], ["zoom"], 7, ["match", ["get", "cls"], "auto", 2.6, 1.4], 11, ["match", ["get", "cls"], "auto", 5, 3]]}});
  map.addLayer({id: "vias", type: "line", source: "vias", layout: {"line-cap": "round", "line-join": "round"},
    paint: {"line-color": "#c66", "line-width": ["interpolate", ["linear"], ["zoom"], 7, ["match", ["get", "cls"], "auto", 1.3, 0.6], 11, ["match", ["get", "cls"], "auto", 3, 1.6]]}});
  // Dim everything outside Navarre so the castles carry the map
  map.addLayer({id: "fuera", type: "fill", source: "prov", filter: ["!", ["get", "nav"]], paint: {"fill-color": "#fff", "fill-opacity": 0.55}});
  map.addLayer({id: "prov-line", type: "line", source: "prov", paint: {"line-color": "#999", "line-width": 0.8}});
  map.addLayer({id: "nav-line", type: "line", source: "prov", filter: ["get", "nav"], paint: {"line-color": "#000", "line-width": 1.6}});
  addPlaces();
  map.addSource("c", {type: "geojson", data: CASTLES});
  map.addLayer({id: "c", type: "circle", source: "c", paint: {
    "circle-radius": ["interpolate", ["linear"], ["zoom"], 7, ["case", ["in", ["get", "e"], ["literal", ["en pie", "restaurado"]]], 6, 5], 11, 11],
    "circle-color": "#888",
    "circle-opacity": ["match", ["get", "e"], "desaparecido", 0, "en pie", 1, "restaurado", 1, "sin estado", 0.75, 0.5],
    "circle-stroke-width": ["case", ["==", ["get", "e"], "desaparecido"], 2, 1.2],
    "circle-stroke-color": "#fff"}});
  map.addLayer({id: "sel", type: "circle", source: "c", filter: ["==", ["id"], -1], paint: {"circle-radius": ["interpolate", ["linear"], ["zoom"], 7, 10, 11, 16], "circle-color": "transparent", "circle-stroke-width": 2, "circle-stroke-color": "#000"}});
  paintTheme(); applyFilter();
  const pop = new maplibregl.Popup({closeButton: false, closeOnClick: false, offset: 10});
  map.on("mousemove", "c", e => { map.getCanvas().style.cursor = "pointer"; const p = e.features[0].properties; pop.setLngLat(e.features[0].geometry.coordinates).setHTML(`<div class="tip">${esc(p.n)}</div><div style="font-size:12px;color:var(--muted)">${p.a > 0 ? p.a : L("sin fecha", "undated")} · ${esc(T_EST(p.e))}</div>`).addTo(map); });
  map.on("mouseleave", "c", () => { map.getCanvas().style.cursor = ""; pop.remove(); });
  map.on("click", "c", e => openPanel(e.features[0]));
});
new MutationObserver(paintTheme).observe(document.documentElement, {attributes: true, attributeFilter: ["data-theme"]});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paintTheme);

// Historical events shown on the timeline (general history of the kingdom, for context)
const EVENTS = [
  {y:824,  es:"Íñigo Arista, primer rey de Pamplona (h. 824)", en:"Íñigo Arista, first king of Pamplona (c. 824)"},
  {y:924,  es:"Abd al-Rahman III arrasa Pamplona y destruye Leguín", en:"Abd al-Rahman III sacks Pamplona and destroys Leguín"},
  {y:1004, es:"Reinado de Sancho III el Mayor (1004–1035), apogeo del reino", en:"Reign of Sancho III the Great (1004–1035), the kingdom at its height"},
  {y:1076, es:"Asesinato de Sancho IV en Peñalén: Navarra se une a Aragón", en:"Sancho IV is killed at Peñalén and Navarre joins Aragon"},
  {y:1134, es:"García Ramírez restaura el reino de Navarra", en:"García Ramírez restores the kingdom of Navarre"},
  {y:1234, es:"Teobaldo I de Champaña: empiezan las casas francesas", en:"Theobald I of Champagne: the French houses begin"},
  {y:1276, es:"Guerra de la Navarrería en Pamplona", en:"War of the Navarrería in Pamplona"},
  {y:1328, es:"Llega la casa de Évreux con Juana II y Felipe III", en:"The house of Évreux arrives with Joan II and Philip III"},
  {y:1451, es:"Guerra civil entre agramonteses y beaumonteses", en:"Civil war between Agramonteses and Beaumonteses"},
  {y:1512, es:"Conquista castellana de Navarra", en:"Castile conquers Navarre"},
  {y:1516, es:"Cisneros ordena derribar las fortalezas navarras", en:"Cardinal Cisneros orders Navarre's fortresses pulled down"},
  {y:1522, es:"Cae Amaiur, último reducto del reino", en:"Amaiur falls, the kingdom's last stronghold"},
  {y:1841, es:"Ley Paccionada: Navarra pasa a provincia foral", en:"The Ley Paccionada makes Navarre a chartered province"},
  {y:1872, es:"Tercera Guerra Carlista: se fortifican pueblos y alturas", en:"Third Carlist War: towns and hilltops are fortified"}
];
const pct = y => (y - MIN) / (MAX - MIN) * 100;
const marks = document.getElementById("marks");
EVENTS.forEach(ev => { const i = document.createElement("i"); i.style.left = pct(ev.y) + "%"; marks.appendChild(i); });
const evBox = document.getElementById("evento"); let evShown = null;
function showEvent(y){
  const ev = [...EVENTS].reverse().find(e => e.y <= y);
  [...marks.children].forEach((m, i) => m.classList.toggle("past", EVENTS[i].y <= y));
  const key = ev ? ev.y + LANG : "none" + LANG;
  if (key === evShown) return; evShown = key;
  evBox.classList.remove("fresh"); void evBox.offsetWidth;
  evBox.innerHTML = ev ? `<span class="ey">${ev.y}</span><span>${esc(L(ev.es, ev.en))}</span>` : `<span style="color:var(--muted)">${L("Mueve la línea de tiempo o pulsa ▶", "Move the timeline or press ▶")}</span>`;
  if (ev) evBox.classList.add("fresh");
}

// Compare: pin a starting year; castles recorded by then turn grey, those that appear afterwards keep their colour
let cmpFrom = null;
const cmpBtn = document.getElementById("cmp"), band = document.getElementById("band");
function cmpText(){
  cmpBtn.setAttribute("aria-pressed", cmpFrom !== null);
  cmpBtn.innerHTML = cmpFrom === null ? `⇆ ${L("Comparar desde este año", "Compare from this year")}` : `${L("Comparando desde", "Comparing from")} ${cmpFrom} <span class="x" aria-hidden="true">×</span>`;
  cmpBtn.title = cmpFrom === null ? L("Fija el año actual y mueve la línea de tiempo para ver qué castillos aparecen después", "Pin the current year, then move the timeline to see which castles appear after it") : L("Quitar comparación", "Stop comparing");
}
cmpBtn.onclick = () => {
  if (cmpFrom !== null) cmpFrom = null;
  else { cmpFrom = +yr.value >= 1900 ? 1512 : +yr.value; yr.value = 1900; }  // from "today" there's nothing to compare, so start at the conquest
  document.body.classList.toggle("comparing", cmpFrom !== null);
  cmpText(); paintCastles(); applyFilter();
};
function paintCastles(){
  if (!map.getLayer("c")) return;
  const col = cmpFrom === null ? colorExpr() : ["case", ["all", [">=", ["get", "a"], 0], ["<=", ["get", "a"], cmpFrom]], tok("--edge"), ["<", ["get", "a"], 0], tok("--edge"), colorExpr()];
  map.setPaintProperty("c", "circle-color", col);
  map.setPaintProperty("c", "circle-stroke-color", ["case", ["==", ["get", "e"], "desaparecido"], col, tok("--surface")]);
}

// Timeline
const yr = document.getElementById("year"), yb = document.getElementById("yearbox"), und = document.getElementById("und"), yc = document.getElementById("ycount");
function applyFilter(){
  const y = +yr.value; yb.textContent = y >= 1900 ? L("Hoy", "Today") : y;
  [...hist.children].forEach((el, i) => el.classList.toggle("on", MIN + i * BIN <= y));
  showEvent(y);
  if (cmpFrom !== null) { band.style.left = pct(cmpFrom) + "%"; band.style.width = Math.max(0, pct(y) - pct(cmpFrom)) + "%"; }
  // Counter: castles documented by this year that pass the period and condition filters
  const es = ESTADOS.filter(x => activeE.has(x.k)).flatMap(x => x.e);
  const ok = f => active.has(f.properties.p) && es.includes(f.properties.e);
  const dated = CASTLES.features.filter(f => ok(f) && f.properties.a >= 0);
  const n = dated.filter(f => f.properties.a <= y).length;
  let t = `<b>${n}</b> ${n === 1 ? L("castillo", "castle") : L("castillos", "castles")}`;
  if (cmpFrom !== null) { const nw = dated.filter(f => f.properties.a > cmpFrom && f.properties.a <= y).length; t += `<span class="plus">+${nw} ${L("desde", "since")} ${cmpFrom}</span>`; }
  yc.innerHTML = t;
  if (!map.getLayer("c")) return;
  map.setFilter("c", ["all", ["in", ["get", "p"], ["literal", [...active]]], ["in", ["get", "e"], ["literal", es]],
    ["any", ["all", [">=", ["get", "a"], 0], ["<=", ["get", "a"], y]], ["all", ["<", ["get", "a"], 0], und.checked]]]);
}
yr.addEventListener("input", applyFilter); und.addEventListener("change", applyFilter);
let timer = null; const play = document.getElementById("play");
play.onclick = () => {
  if (timer) { clearInterval(timer); timer = null; play.textContent = "▶"; return; }
  if (+yr.value >= 1900) yr.value = 700;
  play.textContent = "❚❚";
  const step = matchMedia("(prefers-reduced-motion: reduce)").matches ? 100 : 10;
  let hold = 0;  // pause ~1.4 s on each historical event so the caption can be read
  timer = setInterval(() => {
    if (hold > 0) { hold--; return; }
    const prev = +yr.value; yr.value = Math.min(1900, prev + step); applyFilter();
    if (step === 10 && EVENTS.some(e => e.y > prev && e.y <= +yr.value)) hold = 12;
    if (+yr.value >= 1900) { clearInterval(timer); timer = null; play.textContent = "▶"; }
  }, 120);
};

// Panel
const panel = document.getElementById("panel"), pbody = document.getElementById("pbody");
let openF = null;
function openPanel(f){
  openF = f;
  const p = f.properties;
  map.setFilter("sel", ["==", ["id"], f.id]);
  const per = PERIODS[p.p];
  pbody.innerHTML = `
    <div class="eyebrow" style="color:var(--p${p.p === 5 ? "n" : p.p})">${esc(PN(per))}${per.r ? " · " + PR(per) : ""}</div>
    <h2>${esc(p.n)}</h2>${p.eu ? `<div class="eu">${esc(p.eu)}</div>` : ""}
    <div class="meta"><span class="year">${p.a > 0 ? p.a : "—"}</span><span>${esc(p.f ? T_F(p.f) : L("sin fecha", "undated"))}</span><span class="pill">${esc(T_EST(p.e))}</span><span>${esc(p.m)}</span></div>
    ${p.h ? (LANG === "en" ? `<p class="lang-note">History in Spanish, from the Wikipedia articles.</p>` : "") + `<p lang="es">${esc(p.h)}</p>` : `<p style="color:var(--muted);font-style:italic">${L("Todavía sin historia.", "No history yet.")}</p>`}
    ${p.no ? `<p class="note" lang="es">${esc(p.no)}</p>` : ""}
    <div class="src">${L("Confianza", "Confidence")}: <b>${esc(T_CONF(p.c))}</b>${p.src ? ` · <a href="${esc(p.src)}" target="_blank" rel="noopener">${L("fuente", "source")}</a>` : ""}</div>`;
  panel.hidden = false;
}
document.getElementById("close").onclick = () => { panel.hidden = true; openF = null; map.setFilter("sel", ["==", ["id"], -1]); };
// Search by castle name, Basque name or municipality; picking one flies there and opens its record
const qi = document.getElementById("q"), rl = document.getElementById("results");
const norm = t => String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
let hits = [], sel = -1;
function runSearch(){
  const q = norm(qi.value.trim());
  if (!q) { rl.hidden = true; qi.setAttribute("aria-expanded", "false"); return; }
  const score = f => { const p = f.properties, n = norm(p.n), s = norm(p.n + " " + p.eu + " " + p.m);
    return n.replace(/^(castillo|torre|palacio|fortaleza|fuerte|alcazaba) (de |del |de la )?/, "").startsWith(q) ? 0 : n.includes(q) ? 1 : s.includes(q) ? 2 : 9; };
  hits = CASTLES.features.map(f => [score(f), f]).filter(x => x[0] < 9).sort((a, b) => a[0] - b[0] || a[1].properties.n.localeCompare(b[1].properties.n)).slice(0, 8).map(x => x[1]);
  sel = hits.length ? 0 : -1;
  rl.innerHTML = hits.length ? hits.map((f, i) => `<li role="option" id="r${i}" aria-selected="${i === sel}" data-i="${i}"><span class="rn">${esc(f.properties.n)}</span><span class="rm">${esc(f.properties.m)} · ${f.properties.a > 0 ? f.properties.a : L("sin fecha", "undated")} · ${esc(T_EST(f.properties.e))}</span></li>`).join("")
    : `<li class="empty">${L("Ningún castillo coincide", "No castle matches")}</li>`;
  rl.hidden = false; qi.setAttribute("aria-expanded", "true"); qi.setAttribute("aria-activedescendant", sel >= 0 ? "r0" : "");
}
function pick(f){
  const p = f.properties;
  // Make sure the castle is visible: its period and condition on, timeline past its date
  if (!active.has(p.p)) document.getElementById("per-" + p.p)?.click();
  const est = ESTADOS.find(x => x.e.includes(p.e)); if (est && !activeE.has(est.k)) [...document.getElementById("estados").children][ESTADOS.indexOf(est)].click();
  if (p.a < 0 && !und.checked) { und.checked = true; }
  if (p.a > +yr.value) yr.value = 1900;
  if (timer) play.click();
  applyFilter();
  map.flyTo({center: f.geometry.coordinates, zoom: Math.max(map.getZoom(), 10.5), pitch: 55, duration: matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 1800});
  openPanel(f);
  qi.value = p.n; rl.hidden = true; qi.setAttribute("aria-expanded", "false"); qi.blur();
}
qi.addEventListener("input", runSearch);
qi.addEventListener("focus", () => { if (qi.value) runSearch(); });
qi.addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { if (!hits.length) return; e.preventDefault(); sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + hits.length) % hits.length;
    [...rl.children].forEach((li, i) => li.setAttribute("aria-selected", i === sel)); qi.setAttribute("aria-activedescendant", "r" + sel); rl.children[sel].scrollIntoView({block: "nearest"}); }
  else if (e.key === "Enter" && sel >= 0) { e.preventDefault(); pick(hits[sel]); }
  else if (e.key === "Escape") { rl.hidden = true; qi.setAttribute("aria-expanded", "false"); }
});
rl.addEventListener("mousedown", e => { const li = e.target.closest("li[data-i]"); if (li) { e.preventDefault(); pick(hits[+li.dataset.i]); } });
qi.addEventListener("blur", () => setTimeout(() => { rl.hidden = true; qi.setAttribute("aria-expanded", "false"); }, 120));

// Swap static text and attributes; the Spanish original is kept in data-es-*.
function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-en]").forEach(el => { if (!el.hasAttribute("data-es")) el.setAttribute("data-es", el.textContent); el.textContent = el.getAttribute(LANG === "en" ? "data-en" : "data-es"); });
  document.querySelectorAll("[data-en-aria-label]").forEach(el => { if (!el.hasAttribute("data-es-aria-label")) el.setAttribute("data-es-aria-label", el.getAttribute("aria-label")); el.setAttribute("aria-label", el.getAttribute(LANG === "en" ? "data-en-aria-label" : "data-es-aria-label")); });
  document.title = document.querySelector("title").textContent;
  document.querySelectorAll("[data-set-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.setLang === LANG));
  document.querySelectorAll("[data-en-placeholder]").forEach(el => { if (!el.hasAttribute("data-es-placeholder")) el.setAttribute("data-es-placeholder", el.placeholder); el.placeholder = el.getAttribute(LANG === "en" ? "data-en-placeholder" : "data-es-placeholder"); });
  legendText(); toggleText(); cmpText(); applyFilter(); if (qi.value) runSearch();
  const at = document.querySelector(".maplibregl-ctrl-attrib-inner"); if (at) at.innerHTML = at.innerHTML.replace(/^(Datos|Data):/, L("Datos", "Data") + ":");
  if (openF && !panel.hidden) openPanel(openF);
}
document.querySelectorAll("[data-set-lang]").forEach(b => b.addEventListener("click", () => {
  if (b.dataset.setLang === LANG) return;
  LANG = b.dataset.setLang;
  try { localStorage.setItem("lang", LANG); } catch (e) {}
  try { const u = new URL(location.href); u.searchParams.delete("lang"); history.replaceState(null, "", u.pathname + u.search + u.hash); } catch (e) {}
  applyLang();
}));
applyLang();
</script>
